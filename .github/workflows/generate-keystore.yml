name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Keystore Password (catat baik-baik!)'
        required: true
      alias:
        description: 'Key Alias'
        default: 'upload'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias ${{ github.event.inputs.alias }} \
            -dname "CN=App, OU=Dev, O=MyApp, L=Jakarta, ST=DKI Jakarta, C=ID" \
            -storepass ${{ github.event.inputs.password }} \
            -keypass ${{ github.event.inputs.password }}

      - name: Convert to Base64
        run: base64 -w 0 upload-keystore.jks > keystore-base64.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore-base64.txt
